name: Deploy to GitHub Pages

# Собирает старт (open) и финал (close) и публикует на GitHub Pages.
on:
  push:
    branches: [master, main]
  workflow_dispatch:

# Права для публикации на Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Один активный деплой; новый пуш не отменяет уже идущий
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Полная история: прошлые митапы пересобираются из своих коммитов (archive/meetups.json)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build archive (прошлые митапы из своих коммитов)
        run: pnpm build:archive

      - name: Build decks (dist/<meetup>/{open,close} + лендинг)
        run: pnpm build

      # enablement: true — включает Pages сам на первом прогоне (иначе Not Found, пока не включить вручную)
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
